<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAMIJ Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Header -->
        <header>
            <div>
                <h1>RAMIJ</h1>
                <span>SCIENTIFIC CALCULATOR</span>
            </div>

            <button id="themeBtn">☀</button>
        </header>


        <!-- Display -->
        <section class="display">
            <div id="history"></div>
            <div id="display">0</div>
        </section>


        <!-- Mode -->
        <div class="mode">
            <button class="mode-btn active">BASIC</button>
            <button class="mode-btn">SCIENTIFIC</button>
        </div>


        <!-- Scientific buttons -->
        <div class="scientific-buttons">

            <button onclick="calculateFunction('sin')">sin</button>
            <button onclick="calculateFunction('cos')">cos</button>
            <button onclick="calculateFunction('tan')">tan</button>

            <button onclick="calculateFunction('sqrt')">√</button>
            <button onclick="calculateFunction('log')">log</button>
            <button onclick="calculateFunction('ln')">ln</button>

            <button onclick="calculateFunction('square')">x²</button>
            <button onclick="calculateFunction('cube')">x³</button>
            <button onclick="calculateFunction('abs')">|x|</button>

        </div>


        <!-- Main keypad -->
        <div class="keypad">

            <button class="danger" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>


        <!-- Footer -->
        <footer>
            RAMIJ SCIENTIFIC CALCULATOR
            <span>R1.0</span>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
